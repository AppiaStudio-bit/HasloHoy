<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="HasloHoy: notas y listas privadas, guardadas en tu navegador."><meta name="application-name" content="HasloHoy"><meta name="apple-mobile-web-app-title" content="HasloHoy"><title>HasloHoy</title>
<style>
:root{--ink:#20242d;--muted:#737985;--line:#e8e9ed;--paper:#fff;--canvas:#f8f9fb;--accent:#315df4;--soft:#edf1ff;--danger:#bf3b4a;--shadow:0 10px 28px rgba(28,35,56,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--canvas)}button,input,textarea{font:inherit}button{cursor:pointer}.topbar{height:76px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 clamp(18px,4vw,56px);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:35px;height:35px;color:var(--accent);flex:0 0 auto}.brand-mark svg{display:block;width:35px;height:35px}.brand h1{font-size:18px;letter-spacing:-.02em;margin:0;font-weight:760}.search{height:42px;max-width:500px;flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;background:#fbfbfc;padding:0 13px;color:var(--muted)}.search:focus-within{border-color:#b9c6ff;box-shadow:0 0 0 4px var(--soft)}.search span{font-size:19px}.search input{border:0;background:transparent;outline:0;width:100%;color:var(--ink)}.header-actions{margin-left:auto}.icon-btn{background:transparent;border:0;color:var(--muted);width:38px;height:38px;border-radius:10px;font-size:18px}.icon-btn:hover{background:#f1f3f7;color:var(--ink)}main{max-width:1320px;margin:0 auto;padding:34px clamp(18px,4vw,56px) 100px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.view-title{margin:0;font-size:25px;letter-spacing:-.04em}.count{font-size:13px;color:var(--muted);margin-left:8px;font-weight:500}.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.note-card{background:var(--paper);border:1px solid var(--line);border-radius:15px;min-height:155px;padding:19px 19px 15px;display:flex;flex-direction:column;box-shadow:0 2px 4px rgba(20,28,50,.02);transition:.16s}.note-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d9dce5}.note-title{margin:0 0 9px;font-size:16px;line-height:1.3;overflow-wrap:anywhere}.note-body{margin:0;color:#5c626e;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}.note-tasks{margin:14px 0 0;padding-top:11px;border-top:1px solid #f0f1f4;color:#626875;font-size:12px}.note-tasks strong{color:var(--ink)}.note-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#9a9faa;font-size:11px;margin-top:auto;padding-top:17px}.card-actions{display:flex;gap:2px}.card-actions button{border:0;background:transparent;color:#9a9faa;border-radius:7px;width:27px;height:27px;font-size:14px}.card-actions button:hover{background:#f1f3f7;color:var(--ink)}.card-actions .delete:hover{background:#fff0f1;color:var(--danger)}.empty{grid-column:1/-1;text-align:center;padding:88px 20px;color:var(--muted)}.empty-icon{margin:0 auto 17px;width:58px;height:58px;border-radius:19px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:29px}.empty h2{margin:0 0 6px;font-size:19px;color:var(--ink)}.empty p{margin:0;font-size:14px}.fab{position:fixed;right:clamp(20px,5vw,62px);bottom:28px;width:57px;height:57px;border-radius:18px;background:var(--accent);color:#fff;border:0;font-size:30px;box-shadow:0 8px 20px rgba(49,93,244,.3);z-index:4}.fab:hover{background:#244bda;transform:translateY(-3px)}.modal-backdrop{position:fixed;inset:0;background:rgba(22,27,40,.34);display:grid;place-items:center;padding:18px;z-index:10}.modal-backdrop[hidden]{display:none}.modal{width:min(100%,620px);max-height:min(92vh,760px);background:#fff;border-radius:18px;box-shadow:0 22px 65px rgba(15,22,46,.22);overflow:auto}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:#f3f4f6;border-radius:9px;width:32px;height:32px;color:var(--muted);font-size:20px}.form{padding:4px 22px 22px}.field{display:block;margin-top:14px}.field>span,.tasks-heading{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}.field input,.field textarea,.task-text,.task-reminder{width:100%;border:1px solid var(--line);border-radius:10px;background:#fcfcfd;padding:10px 12px;outline:0;color:var(--ink)}.field input:focus,.field textarea:focus,.task-text:focus,.task-reminder:focus{border-color:#aebdff;box-shadow:0 0 0 3px var(--soft)}.field textarea{min-height:130px;resize:vertical;line-height:1.5}.tasks-section{margin-top:21px}.task-add{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:start}.task-add input{min-width:0}.task-time-control{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.task-time-input{display:none;width:180px}.task-time-input.visible{display:block}.task-time-button{white-space:nowrap}.task-time-clear{display:none;border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:7px;font-size:12px}.task-time-clear.visible{display:inline-block}.task-time-clear:hover{color:var(--danger);background:#fff0f1}.secondary{border:1px solid #dfe3ee;background:#fff;color:var(--accent);padding:9px 13px;border-radius:9px;font-weight:650}.secondary:hover{background:var(--soft)}.task-list{display:grid;gap:8px;margin-top:10px}.task-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:7px;padding:7px 0}.task-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}.task-row.done .task-text{text-decoration:line-through;color:#989da8}.task-reminder{font-size:12px;padding:8px;width:180px}.task-configure{border:1px solid #dfe3ee;background:#fff;color:var(--accent);padding:8px 10px;border-radius:9px;font-size:12px;font-weight:650;white-space:nowrap}.task-configure:hover{background:var(--soft)}.task-reminder-wrap .task-reminder{display:none}.task-reminder-wrap .task-reminder.visible{display:block}.task-remove,.task-clear-reminder{border:0;background:transparent;color:#9a9faa;border-radius:7px;padding:6px;font-size:15px}.task-remove:hover,.task-clear-reminder:hover{color:var(--danger);background:#fff0f1}.task-reminder-wrap{display:flex;align-items:center;gap:2px}.permission{margin-top:11px;font-size:12px;color:var(--muted)}.permission button{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}.form-footer{display:flex;align-items:center;justify-content:flex-end;margin-top:19px;gap:9px}.primary{border:0;background:var(--accent);color:#fff;padding:11px 19px;border-radius:10px;font-weight:700}.primary:hover{background:#244bda}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,15px);background:#222833;color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.topbar{height:auto;min-height:70px;flex-wrap:wrap;gap:12px;padding:14px 18px}.header-actions{display:none}.search{order:3;flex-basis:100%;max-width:none}main{padding-top:25px}.notes-grid{grid-template-columns:1fr}.fab{right:20px;bottom:20px}.task-row{grid-template-columns:auto 1fr auto}.task-reminder-wrap{grid-column:2/-1}.task-reminder{width:180px}.task-reminder-wrap{justify-content:flex-start}.empty{padding:70px 15px}}
</style></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" role="img" aria-label="Reloj HasloHoy"><circle cx="20" cy="20" r="15.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M20 11.5v9l6 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="1.8" fill="currentColor"/></svg></span><h1>HasloHoy</h1></div><label class="search" aria-label="Buscar notas"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Buscar en tus notas…" autocomplete="off"></label><div class="header-actions"><button class="icon-btn" id="clearSearch" title="Limpiar búsqueda" aria-label="Limpiar búsqueda">×</button></div></header>
<main><div class="toolbar"><h2 class="view-title">Mis notas <span class="count" id="count"></span></h2></div><section class="notes-grid" id="notesGrid" aria-live="polite"></section></main><button class="fab" id="newNote" aria-label="Crear una nota" title="Crear una nota">+</button>
<div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Nueva nota</h2><button class="close" id="closeModal" aria-label="Cerrar">×</button></div><form class="form" id="noteForm"><label class="field"><span>TÍTULO</span><input id="titleInput" maxlength="120" placeholder="Un título breve" autocomplete="off"></label><label class="field"><span>CONTENIDO</span><textarea id="bodyInput" maxlength="5000" placeholder="Escribe lo que quieras recordar…"></textarea></label><section class="tasks-section" aria-labelledby="tasksHeading"><span class="tasks-heading" id="tasksHeading">TAREAS</span><div class="task-add"><input id="taskInput" class="task-text" maxlength="240" placeholder="Añadir una tarea…"><div class="task-time-control"><button type="button" class="secondary task-time-button" id="taskTimeButton">◷ Configurar hora</button><input id="taskTimeInput" class="task-time-input" type="datetime-local" aria-label="Hora del recordatorio de la nueva tarea"><button type="button" class="task-time-clear" id="taskTimeClear" title="Quitar recordatorio" aria-label="Quitar recordatorio">Quitar hora</button></div><button type="button" class="secondary" id="addTask">Añadir</button></div><div id="taskList" class="task-list"></div><div id="permission" class="permission" hidden>Para recibir avisos mientras esta página está abierta, <button type="button" id="allowNotifications">permitir notificaciones</button>.</div></section><div class="form-footer"><button class="primary" type="submit">Guardar nota</button></div></form></section></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const STORAGE_KEY='haslohoy-notes-v3',OLD_KEYS=['notas-blancas-notes-v2','notas-blancas-notes-v1'];let notes=load(),editingId=null,draft=null,pendingReminder=null;
const $=id=>document.getElementById(id),grid=$('notesGrid'),modal=$('modalBackdrop'),form=$('noteForm'),title=$('titleInput'),body=$('bodyInput'),search=$('searchInput'),count=$('count'),taskInput=$('taskInput'),taskList=$('taskList'),taskTimeButton=$('taskTimeButton'),taskTimeInput=$('taskTimeInput'),taskTimeClear=$('taskTimeClear');
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}function load(){try{let raw=localStorage.getItem(STORAGE_KEY);if(!raw)for(const key of OLD_KEYS){raw=localStorage.getItem(key);if(raw)break;}const a=JSON.parse(raw||'[]');return Array.isArray(a)?a.map(n=>({...n,tasks:Array.isArray(n.tasks)?n.tasks.map(t=>({id:t.id||uid(),text:String(t.text||''),done:!!t.done,reminder:t.reminder||null,notifiedAt:t.notifiedAt||null})):[]})):[]}catch(e){return[]}}function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(notes));try{if(window.HasloHoyBridge&&window.HasloHoyBridge.syncReminders)window.HasloHoyBridge.syncReminders(JSON.stringify(notes))}catch(e){/* native bridge unavailable in browser */}}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function label(ts){return new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short'}).format(new Date(ts)).replace('.','')}
function render(){const term=search.value.trim().toLocaleLowerCase('es');const shown=notes.filter(n=>!term||`${n.title} ${n.body} ${(n.tasks||[]).map(t=>t.text).join(' ')}`.toLocaleLowerCase('es').includes(term)).sort((a,b)=>b.updatedAt-a.updatedAt);count.textContent=`${shown.length} ${shown.length===1?'nota':'notas'}`;if(!shown.length){grid.innerHTML=`<div class="empty"><div class="empty-icon" aria-hidden="true">□</div><h2>${term?'No hay resultados':'Tu espacio está despejado'}</h2><p>${term?'Prueba con otra palabra.':'Crea tu primera nota con el botón +.'}</p></div>`;return}grid.innerHTML=shown.map(n=>{const tasks=n.tasks||[],done=tasks.filter(t=>t.done).length;return `<article class="note-card"><h3 class="note-title">${esc(n.title)||'Sin título'}</h3><p class="note-body">${esc(n.body)||'Sin contenido'}</p>${tasks.length?`<div class="note-tasks"><strong>☑ ${done}/${tasks.length}</strong> tareas completadas${tasks.filter(t=>t.reminder).map(t=>`<div>◷ ${esc(t.text)} · ${new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t.reminder))}</div>`).join('')}</div>`:''}<div class="note-meta"><span>${label(n.updatedAt)}</span><span class="card-actions"><button data-action="edit" data-id="${n.id}" title="Editar" aria-label="Editar">✎</button><button class="delete" data-action="delete" data-id="${n.id}" title="Eliminar" aria-label="Eliminar">⌫</button></span></div></article>`}).join('')}
function openEditor(note){pendingReminder=null;taskTimeInput.value='';taskTimeInput.classList.remove('visible');taskTimeClear.classList.remove('visible');taskTimeButton.textContent='◷ Configurar hora';editingId=note?.id||null;draft=note?JSON.parse(JSON.stringify(note)):{id:uid(),title:'',body:'',tasks:[],createdAt:Date.now()};$('modalTitle').textContent=note?'Editar nota':'Nueva nota';title.value=draft.title||'';body.value=draft.body||'';renderTasks();modal.hidden=false;setTimeout(()=>title.focus(),30)}function closeEditor(){modal.hidden=true;editingId=null;draft=null;pendingReminder=null;form.reset();taskList.innerHTML='';taskTimeInput.classList.remove('visible');taskTimeClear.classList.remove('visible');taskTimeButton.textContent='◷ Configurar hora'}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2200)}
function localDate(v){if(!v)return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return'';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function renderTasks(){taskList.innerHTML=(draft.tasks||[]).map(t=>`<div class="task-row ${t.done?'done':''}" data-id="${t.id}"><input type="checkbox" data-task="done" ${t.done?'checked':''} aria-label="Tarea completada"><input class="task-text" data-task="text" value="${esc(t.text)}" maxlength="240" aria-label="Texto de la tarea"><div class="task-reminder-wrap"><button type="button" class="task-configure" data-task="configure">◷ ${t.reminder?'Cambiar hora':'Configurar hora'}</button><input class="task-reminder" type="datetime-local" data-task="reminder" value="${localDate(t.reminder)}" aria-label="Recordatorio"><button type="button" class="task-clear-reminder" data-task="clear" title="Quitar recordatorio" aria-label="Quitar recordatorio">×</button></div><button type="button" class="task-remove" data-task="remove" title="Eliminar tarea" aria-label="Eliminar tarea">⌫</button></div>`).join('');$('permission').hidden=!(draft.tasks||[]).some(t=>t.reminder)&&!(window.Notification&&Notification.permission==='default')}
function updateTask(row,kind,value){const t=draft.tasks.find(x=>x.id===row.dataset.id);if(!t)return;if(kind==='remove'){draft.tasks=draft.tasks.filter(x=>x!==t)}else if(kind==='clear'){t.reminder=null;t.notifiedAt=null}else if(kind==='reminder'){t.reminder=value?new Date(value).toISOString():null;t.notifiedAt=null}else if(kind==='done')t.done=value;else t.text=value;renderTasks()}
$('newNote').onclick=()=>openEditor();taskTimeButton.onclick=()=>{taskTimeInput.classList.add('visible');taskTimeInput.focus();};taskTimeInput.onchange=()=>{pendingReminder=taskTimeInput.value?new Date(taskTimeInput.value).toISOString():null;taskTimeClear.classList.toggle('visible',!!pendingReminder);taskTimeButton.textContent=pendingReminder?'◷ Hora configurada':'◷ Configurar hora'};taskTimeClear.onclick=()=>{pendingReminder=null;taskTimeInput.value='';taskTimeInput.classList.remove('visible');taskTimeClear.classList.remove('visible');taskTimeButton.textContent='◷ Configurar hora';taskTimeButton.focus()};$('closeModal').onclick=closeEditor;modal.onclick=e=>{if(e.target===modal)closeEditor()};document.onkeydown=e=>{if(e.key==='Escape'&&!modal.hidden)closeEditor()};$('addTask').onclick=()=>{const text=taskInput.value.trim();if(!text)return;draft.tasks.push({id:uid(),text,done:false,reminder:pendingReminder,notifiedAt:null});taskInput.value='';pendingReminder=null;taskTimeInput.value='';taskTimeInput.classList.remove('visible');taskTimeClear.classList.remove('visible');taskTimeButton.textContent='◷ Configurar hora';renderTasks();taskInput.focus()};taskInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('addTask').click()}};
taskList.onchange=e=>{const row=e.target.closest('.task-row');if(!row)return;const k=e.target.dataset.task;updateTask(row,k,k==='done'?e.target.checked:e.target.value)};taskList.oninput=e=>{if(e.target.dataset.task==='text'){const t=draft.tasks.find(x=>x.id===e.target.closest('.task-row').dataset.id);if(t)t.text=e.target.value}};taskList.onclick=e=>{const b=e.target.closest('[data-task]');if(!b)return;if(b.dataset.task==='configure'){const input=b.closest('.task-reminder-wrap').querySelector('.task-reminder');input.classList.add('visible');input.focus();return}if(b.dataset.task==='remove'||b.dataset.task==='clear')updateTask(b.closest('.task-row'),b.dataset.task)};
$('allowNotifications').onclick=()=>requestPermission(true);function requestPermission(manual){if(!('Notification'in window)){if(manual)toast('Este navegador no admite notificaciones');return}Notification.requestPermission().then(p=>{renderTasks();if(manual)toast(p==='granted'?'Avisos activados':'Avisos no activados')})}
form.onsubmit=e=>{e.preventDefault();const now=Date.now(),data={title:title.value.trim(),body:body.value.trim(),tasks:(draft.tasks||[]).filter(t=>t.text.trim()),updatedAt:now};if(!data.title&&!data.body&&!data.tasks.length){title.focus();toast('Escribe algo antes de guardar');return}if(data.tasks.some(t=>t.reminder)&&window.Notification&&Notification.permission==='default')requestPermission(false);if(editingId){const i=notes.findIndex(n=>n.id===editingId);notes[i]={...notes[i],...data}}else notes.push({id:draft.id,createdAt:now,...data});persist();render();closeEditor();toast('Nota guardada')};
grid.onclick=e=>{const b=e.target.closest('button[data-action]');if(!b)return;const i=notes.findIndex(n=>n.id===b.dataset.id);if(i<0)return;if(b.dataset.action==='edit')openEditor(notes[i]);if(b.dataset.action==='delete'&&confirm('¿Eliminar esta nota y sus tareas?')){notes.splice(i,1);persist();render();toast('Nota eliminada')}};search.oninput=render;$('clearSearch').onclick=()=>{search.value='';search.focus();render()};
function checkReminders(){const now=Date.now();let changed=false;notes.forEach(n=>(n.tasks||[]).forEach(t=>{if(!t.done&&t.reminder&&!t.notifiedAt&&new Date(t.reminder).getTime()<=now){t.notifiedAt=now;changed=true;const msg=`Recordatorio: ${t.text}`;toast(msg);if('Notification'in window&&Notification.permission==='granted')new Notification('HasloHoy',{body:msg})}}));if(changed)persist()}setInterval(checkReminders,15000);checkReminders();render();
})();
</script></body></html>
